# Container-local administration; database has no published host port.
local all all trust
# Require TLS and password authentication on every network connection.
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
