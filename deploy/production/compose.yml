name: ${COMPOSE_PROJECT_NAME:-artifact-keeper-production}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  volume-init:
    image: ${INIT_IMAGE:?Run prepare.py first}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for dir in /storage /backups /plugins /scan-workspace; do
          chown 1001:0 "$$dir"
          chmod 0770 "$$dir"
        done
        cp /input/postgres-server.crt /pg-certs/server.crt
        cp /input/postgres-server.key /pg-certs/server.key
        cp /input/postgres-ca.crt /pg-certs/ca.crt
        chown 70:70 /pg-certs/server.key /pg-certs/server.crt /pg-certs/ca.crt
        chmod 0600 /pg-certs/server.key
        chmod 0644 /pg-certs/server.crt /pg-certs/ca.crt
    volumes:
      - ./certs/postgres:/input:ro,z
      - pg_certs:/pg-certs
      - artifact_storage:/storage
      - backup_storage:/backups
      - plugins_storage:/plugins
      - scan_workspace:/scan-workspace
    network_mode: none
    restart: "no"
    mem_limit: 128m
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:?Run prepare.py first}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: artifact_keeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql
      - pg_certs:/certs:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro,z
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artifact_keeper"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    logging: *logging

  opensearch:
    image: ${OPENSEARCH_IMAGE:?Run prepare.py first}
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # No host ports. Only services on this private Compose bridge can connect.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?Run prepare.py first}
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://artifact_keeper:${POSTGRES_APP_PASSWORD:?Required}@postgres:5432/artifact_keeper?sslmode=verify-full&sslrootcert=/certs/ca.crt"
      JWT_SECRET: ${JWT_SECRET:?Required}
      SSO_ENCRYPTION_KEY: ${SSO_ENCRYPTION_KEY:?Required}
      AK_WEBHOOK_SECRET_KEY: ${AK_WEBHOOK_SECRET_KEY:?Required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Required}
      BIND_ADDRESS: 0.0.0.0:8080
      ENVIRONMENT: production
      LOG_LEVEL: info
      RUST_LOG: info
      LOG_FORMAT: json
      AUDIT_STREAM: stdout
      CORS_ORIGINS: "https://${SITE_ADDRESS:?Required}"
      RATE_LIMIT_TRUSTED_PROXY_CIDRS: "${CADDY_IP:-172.31.240.10}/32"
      AK_GUEST_ACCESS_ENABLED: ${AK_GUEST_ACCESS_ENABLED:-true}
      ENABLE_SWAGGER: "false"
      STORAGE_BACKEND: filesystem
      STORAGE_PATH: /data/storage
      BACKUP_PATH: /data/backups
      PLUGINS_DIR: /data/plugins
      SCAN_WORKSPACE_PATH: /scan-workspace
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_ALLOW_INVALID_CERTS: "false"
      DEPENDENCY_TRACK_ENABLED: "false"
      TRIVY_URL: ${TRIVY_URL:-}
      INCUS_SCANNER_ENABLED: "false"
      GRYPE_DB_AUTO_UPDATE: "false"
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
      ALLOW_HTTP_INTEGRATIONS: "1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,postgres,opensearch,trivy,backend,web"
    volumes:
      - artifact_storage:/data/storage
      - backup_storage:/data/backups
      - plugins_storage:/data/plugins
      - scan_workspace:/scan-workspace
      - pg_certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/livez"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped
    logging: *logging

  web:
    image: ${WEB_IMAGE:?Run prepare.py first}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      NODE_ENV: production
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:?Run prepare.py first}
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Required}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,backend,web"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./certs/https:/etc/caddy/certs:ro,z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: ${CADDY_IP:-172.31.240.10}
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped
    logging: *logging

  # Enable only after importing Trivy's vulnerability databases; see README.
  trivy:
    profiles: [scanning]
    image: ${TRIVY_IMAGE:?Run prepare.py first}
    command: ["server", "--listen", "0.0.0.0:8090", "--skip-db-update", "--skip-java-db-update"]
    environment:
      TRIVY_CACHE_DIR: /root/.cache/trivy
    volumes:
      - trivy_cache:/root/.cache/trivy
      - scan_workspace:/scan-workspace:ro
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.31.240.0/24}

volumes:
  pg_certs:
  postgres_data:
  artifact_storage:
  backup_storage:
  plugins_storage:
  scan_workspace:
  opensearch_data:
  caddy_data:
  caddy_config:
  trivy_cache:
