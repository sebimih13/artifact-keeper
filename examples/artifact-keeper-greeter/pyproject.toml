[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-keeper-greeter"
version = "2.0.0"
description = "A tiny example package published to Artifact Keeper"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Artifact Keeper Example" }]

[tool.setuptools.packages.find]
where = ["src"]
